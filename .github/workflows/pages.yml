name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "public/**"
      - "scripts/build-pages.mjs"
      - "tests/cursor.test.mjs"
      - "tests/ifc-disclosure.test.mjs"
      - "tests/pages-demo.test.mjs"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test Pages demo
        run: node --test tests/pages-demo.test.mjs tests/ifc.test.mjs tests/ifc-disclosure.test.mjs tests/public-sources.test.mjs tests/cursor.test.mjs
      - name: Build static site
        run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
